spring.application.name=finance

# DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finance_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finance_secure_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=${PORT:5174}
spring.mvc.servlet.load-on-startup=1

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
logging.level.org.springframework.security=DEBUG

# Reference rates to INR for the FX fields (Frankfurter — free, no API key).
# FBIL (the official RBI reference rate) for USD/EUR/GBP/JPY, ECB for the rest
# and as the fallback. Live rates are returned as-is and not stored; fx_rate rows
# (seed / manual) are only read when the live lookup fails.
# Set ZARIA_FX_FRANKFURTER_ENABLED=false to work offline (fx_rate rows only).
zaria.fx.frankfurter.enabled=${ZARIA_FX_FRANKFURTER_ENABLED:true}
zaria.fx.frankfurter.base-url=${ZARIA_FX_FRANKFURTER_BASE_URL:https://api.frankfurter.dev}
zaria.fx.frankfurter.timeout-ms=${ZARIA_FX_FRANKFURTER_TIMEOUT_MS:5000}

# Daily reminder sweep for disbursement release criteria. The sweep deduplicates
# on a unique key, so a missed, repeated or concurrent run cannot double-notify.
zaria.reminders.enabled=${ZARIA_REMINDERS_ENABLED:true}
zaria.reminders.cron=${ZARIA_REMINDERS_CRON:0 0 1 * * *}

# Employee PAN / Aadhaar uploads are capped at 5 MB (checked again in EmployeeDocumentService).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
